name: Build

on:
  push:
    branches:
      - main

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Build plugin
        run: |
          chmod +x gradlew || true
          ./gradlew make --no-daemon

      - name: Prepare deployment
        run: |
          mkdir -p deployment
          cp -r build/*.cs3 deployment/ 2>/dev/null || true
          cp -r build/repo.json deployment/ 2>/dev/null || true
          # Also check subproject build dirs
          for dir in */build; do
            cp -r "$dir"/*.cs3 deployment/ 2>/dev/null || true
            cp -r "$dir"/repo.json deployment/ 2>/dev/null || true
          done
          # Use the root repo.json if available
          if [ -f build/repo.json ]; then
            cp build/repo.json deployment/
          fi
          ls -la deployment/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deployment

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
